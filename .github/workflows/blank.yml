name: Build APK Siap Pakai

on:
  push:
    branches: [ "main" ] # Sesuaikan dengan nama branch utama Anda (misal: main atau master)
  pull_request:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-node: '20' # Sesuaikan dengan versi Node.js proyek Anda

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Memeriksa isi struktur folder repositori Anda
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          
          echo "--- DAFTAR FOLDER DI REPOSITORI ANDA ---"
          ls -la
          echo "========================================"
          
          # Mencari letak asli package.json tanpa memicu error dirname
          # Menggunakan pwd agar mendapatkan full path absolut komputer runner
          TARGET_FILE=$(find $(pwd) -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          
          if [ -z "$TARGET_FILE" ]; then
            echo "ERROR: File package.json tidak ditemukan sama sekali di repositori ini!"
            exit 1
          fi
          
          SUBDIR=$(dirname "$TARGET_FILE")
          echo "Project directory otomatis ditemukan di: $SUBDIR"
          echo "PROJECT_DIR=$SUBDIR" >> $GITHUB_ENV

      - name: Install Dependencies & Capacitor
        run: |
          cd ${{ env.PROJECT_DIR }}
          npm install
          npx install @capacitor/core @capacitor/cli
          npx cap init "Aplikasi Warga" "com.warga.greenpanorama" --web-dir=www --confirm

      - name: Add Android Platform
        run: |
          cd ${{ env.PROJECT_DIR }}
          npx cap add android

      - name: Sync Code to Android Project
        run: |
          cd ${{ env.PROJECT_DIR }}
          npx cap sync android

      - name: Build APK Mentah (Debug)
        run: |
          cd ${{ env.PROJECT_DIR }}/android && ./gradlew assembleDebug

      - name: Upload APK ke GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.0.5-${{ github.run_number }}
          name: Aplikasi Warga Versi 1.0.5 (${{ github.run_number }})
          body: |
            Build otomatis berhasil untuk versi android.

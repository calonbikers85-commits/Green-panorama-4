name: Build APK Siap Pakai

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  create:
    tags:
      - v*

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK & Accept Licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Memeriksa isi struktur folder repositori Anda
        run: |
          TARGET_FILE=$(find $(pwd) -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$TARGET_FILE" ]; then
            echo "PROJECT_DIR=$(pwd)" >> $GITHUB_ENV
          else
            SUBDIR=$(dirname "$TARGET_FILE")
            echo "PROJECT_DIR=$SUBDIR" >> $GITHUB_ENV
          fi

      - name: Install Dependencies & Capacitor
        run: |
          cd ${{ env.PROJECT_DIR }}
          npm cache clean --force
          npm install --legacy-peer-deps
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --legacy-peer-deps

      # PERBAIKAN 1: Memaksa pembuatan konfigurasi Capacitor statis yang bersih
      - name: Generate Capacitor Config File
        run: |
          cd ${{ env.PROJECT_DIR }}
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.warga.greenpanorama",
            "appName": "Aplikasi Warga",
            "webDir": "www"
          }
          EOF

      # PERBAIKAN 2: Mengamankan folder www dan memindahkan index.html ke target yang benar agar terdeteksi
      - name: Prepare Web Assets Directory
        run: |
          cd ${{ env.PROJECT_DIR }}
          mkdir -p www
          # Mencari file index.html di mana pun di repositori lalu menyalinnya secara paksa ke folder www utama
          find . -name "index.html" -not -path "*/node_modules/*" -exec cp {} ./www/index.html \; || true
          
          # Jika file index.html tetap tidak ditemukan, buat file index.html cadangan otomatis agar build tidak gagal
          if [ ! -f "./www/index.html" ]; then
            cat <<EOF > ./www/index.html
            <!DOCTYPE html><html><head><title>Aplikasi Warga</title></head><body><h1>Green Panorama 4</h1></body></html>
          EOF
          fi

      - name: Add Android Platform
        run: |
          cd ${{ env.PROJECT_DIR }}
          rm -rf android
          npx cap add android

      - name: Sync Code to Android Project
        run: |
          cd ${{ env.PROJECT_DIR }}
          npx cap sync android

      - name: Build APK Mentah (Debug)
        run: |
          cd ${{ env.PROJECT_DIR }}/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK ke GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-Warga-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK ke GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'create' && github.event.ref_type == 'tag'
        with:
          files: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: ${{ github.event.ref }}
          name: Aplikasi Warga Versi ${{ github.event.ref }}

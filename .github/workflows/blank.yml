name: Deploy Aplikasi Warga Online

on:
  push:
    branches: ["main"] # Otomatis jalan saat Anda push ke branch main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Jalankan Proses Deploy ke Server
        # Kode ini memicu server (contoh: Render) untuk menarik kode terbaru Anda
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

name: Build APK Siap Pakai

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Fitur tambahan agar proses build APK langsung berjalan setiap kali Anda membuat tag rilis baru
  create:
    tags:
      - v*

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK & Accept Licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Memeriksa isi struktur folder repositori Anda
        run: |
          TARGET_FILE=$(find $(pwd) -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$TARGET_FILE" ]; then
            echo "PROJECT_DIR=$(pwd)" >> $GITHUB_ENV
          else
            SUBDIR=$(dirname "$TARGET_FILE")
            echo "PROJECT_DIR=$SUBDIR" >> $GITHUB_ENV
          fi

      # PERBAIKAN UTAMA: Memaksa instalasi library inti Android platform agar terdeteksi oleh Capacitor
      - name: Install Dependencies & Capacitor
        run: |
          cd ${{ env.PROJECT_DIR }}
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Aplikasi Warga" "com.warga.greenpanorama" --web-dir=www --confirm || true

      - name: Add Android Platform
        run: |
          cd ${{ env.PROJECT_DIR }}
          # Menghapus folder android lama jika ada konflik, lalu membuat ulang platform android fresh
          rm -rf android
          npx cap add android

      - name: Sync Code to Android Project
        run: |
          cd ${{ env.PROJECT_DIR }}
          npx cap sync android

      # PERBAIKAN KEDUA: Memaksa eksekusi gradlew assembleDebug secara mutlak tanpa syarat pengecekan folder lokal
      - name: Build APK Mentah (Debug)
        run: |
          cd ${{ env.PROJECT_DIR }}/android
          chmod +x gradlew
          ./gradlew assembleDebug

      # PERBAIKAN KETIGA: Memastikan file APK langsung dikirim ke menu rilis utama dan halaman tab Actions (Artifacts)
      - name: Upload APK ke GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-Warga-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK ke GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'create' && github.event.ref_type == 'tag'
        with:
          files: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: ${{ github.event.ref }}
          name: Aplikasi Warga Versi ${{ github.event.ref }}

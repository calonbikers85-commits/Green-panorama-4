name: Build APK Siap Pakai

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK & Accept Licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Memeriksa isi struktur folder repositori Anda
        run: |
          echo "--- DAFTAR FOLDER DI REPOSITORI ANDA ---"
          ls -la
          echo "========================================"
          
          TARGET_FILE=$(find $(pwd) -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          
          if [ -z "$TARGET_FILE" ]; then
            echo "PERINGATAN: File package.json belum di-upload ke GitHub!"
            echo "Gunakan perintah 'git add .' dan 'git push' dari terminal komputer Anda."
            echo "PROJECT_DIR=$(pwd)" >> $GITHUB_ENV
          else
            SUBDIR=$(dirname "$TARGET_FILE")
            echo "Project directory otomatis ditemukan di: $SUBDIR"
            echo "PROJECT_DIR=$SUBDIR" >> $GITHUB_ENV
          fi

      # Baris di bawah ini diberi pengaman agar tidak macet total jika package.json belum Anda push
      - name: Install Dependencies & Capacitor
        run: |
          cd ${{ env.PROJECT_DIR }}
          npm install || echo "Abaikan jika package.json tidak ada"
          npm install @capacitor/core @capacitor/cli || true
          npx cap init "Aplikasi Warga" "com.warga.greenpanorama" --web-dir=www --confirm || true

      - name: Add Android Platform
        run: |
          cd ${{ env.PROJECT_DIR }}
          npx cap add android || true

      - name: Sync Code to Android Project
        run: |
          cd ${{ env.PROJECT_DIR }}
          npx cap sync android || true

      - name: Build APK Mentah (Debug)
        run: |
          if [ -d "${{ env.PROJECT_DIR }}/android" ]; then
            cd ${{ env.PROJECT_DIR }}/android && ./gradlew assembleDebug
          else
            echo "Folder android belum dibuat. Silakan upload proyek Anda dari komputer lokal."
          fi

      - name: Upload APK ke GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.0.5-${{ github.run_number }}
          name: Aplikasi Warga Versi 1.0.5 (${{ github.run_number }})
          body: |
            Build otomatis berhasil untuk versi android.

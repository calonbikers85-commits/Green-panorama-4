name: Build APK Siap Pakai

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK & Accept Licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Package JSON Emergency
        run: |
          cat <<EOF > package.json
          {
            "name": "aplikasi-warga",
            "version": "1.0.0",
            "description": "Aplikasi Warga Green Panorama",
            "main": "index.js"
          }
          EOF

      - name: Install Dependencies & Capacitor
        run: |
          npm cache clean --force
          npm install --legacy-peer-deps
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --legacy-peer-deps

      - name: Generate Capacitor Config File
        run: |
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.warga.greenpanorama",
            "appName": "Green Panorama 4",
            "webDir": "public"
          }
          EOF

      - name: Add Android Platform
        run: |
          rm -rf android
          npx cap add android

      - name: Configure Android Network Security & Permissions
        run: |
          cd android/app/src/main
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />' AndroidManifest.xml
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' AndroidManifest.xml

      - name: Sync Code to Android Project
        run: |
          npx cap sync android

      - name: Build APK Mentah (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK ke GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-Warga-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

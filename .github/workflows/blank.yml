name: Build APK Siap Pakai

on:
  push:
    branches: ["main"]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Java (Android SDK Requirement)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_ENV_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_ENV_ROOT" >> $GITHUB_ENV

      # Perbaikan Utama: Mengunci folder ke subfolder proyek secara langsung
      - name: Install Dependencies & Capacitor
        run: |
          cd Green-panorama-4
          npm install
          npm install @capacitor/core @capacitor/cli
          npx cap init "Aplikasi Warga" "com.warga.greenpanorama" --web-dir=www --confirm

      - name: Add Android Platform
        run: |
          cd Green-panorama-4
          npx cap add android

      - name: Sync Code to Android Project
        run: |
          cd Green-panorama-4
          npx cap sync android

      - name: Build APK Mentah (Debug)
        run: |
          cd Green-panorama-4/android && ./gradlew assembleDebug

      - name: Upload APK ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: Green-panorama-4/android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.0.5-${{ github.run_number }}
          name: Aplikasi Warga Versi 1.0.5 (${{ github.run_number }})
          body: |
            Halo Warga! Silakan unduh file APK di bawah ini untuk menginstal aplikasi.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

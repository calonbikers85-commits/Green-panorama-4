<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Panorama 4</title>
    <!-- Library Tampilan -->
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <script src="https://jsdelivr.net"></script>
    <!-- SDK Firebase Resmi -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body class="bg-gray-100">

    <div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-md relative pb-20">
        
        <!-- HALAMAN LOGIN -->
        <div v-if="!isLoggedIn" class="p-6 pt-20">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-green-700 rounded-full flex items-center justify-center mx-auto mb-4 text-white text-3xl shadow">
                    <i class="fas fa-tree"></i>
                </div>
                <h1 class="text-2xl font-bold text-green-800">GREEN PANORAMA 4</h1>
                <p class="text-gray-500 text-sm">Portal Mandiri Mobile Warga Perumahan</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-gray-700 font-semibold mb-2 text-sm">Nomor Blok Rumah</label>
                    <input type="text" v-model="inputBlok" placeholder="Contoh: B-12" class="w-full border p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-2 text-sm">Password Akses Warga</label>
                    <input type="password" v-model="inputPassword" placeholder="Masukkan password Anda" class="w-full border p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>
                <button @click="prosesLogin" class="w-full bg-green-700 text-white font-bold p-3 rounded-lg mt-4 hover:bg-green-800 transition duration-200">
                    Masuk ke Sistem Aplikasi
                </button>
            </div>
        </div>

        <!-- HALAMAN UTAMA (TERBUKA SETELAH LOGIN) -->
        <div v-else class="p-4">
            <div class="bg-green-700 text-white p-4 rounded-2xl shadow-lg mb-6">
                <h2 class="text-xl font-bold">Halo, {{ namaWarga }}!</h2>
                <p class="text-sm text-green-100">Blok Rumah Anda: {{ blokRumah }}</p>
                <div class="mt-4 p-3 bg-green-600 rounded-xl text-xs border border-green-500/30">
                    <i class="fas fa-link mr-1"></i> Status: Terhubung Nyata ke Firebase Database Google!
                </div>
            </div>

            <h4 class="text-gray-500 font-bold text-xs uppercase tracking-wider mb-3">Layanan Warga</h4>
            <div class="grid grid-cols-2 gap-3 text-center">
                <div class="bg-white p-4 rounded-xl border border-green-200 shadow-sm flex flex-col items-center">
                    <i class="fas fa-qrcode text-green-700 text-2xl mb-2"></i>
                    <span class="text-xs font-semibold text-gray-700">Izin Masuk Tamu</span>
                </div>
                <div @click="logout" class="bg-red-50 p-4 rounded-xl border border-red-200 shadow-sm flex flex-col items-center cursor-pointer">
                    <i class="fas fa-sign-out-alt text-red-600 text-2xl mb-2"></i>
                    <span class="text-xs font-semibold text-red-700">Keluar Aplikasi</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Konfigurasi Database Firebase Green Panorama 4 Anda
        const firebaseConfig = {
          apiKey: "AIzaSyARCo6J_FEt550EGzej",
          authDomain: "://firebaseapp.com",
          projectId: "green-panorama-4",
          storageBucket: "://appspot.com",
          messagingSenderId: "584774986138",
          appId: "1:584774986138:web:4a1bb5",
          measurementId: "G-1Y1RH3S39F",
          databaseURL: "https://firebaseio.com"
        };

        // Inisialisasi Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Inisialisasi Vue.js
        new Vue({
            el: '#app',
            data: {
                isLoggedIn: false,
                inputBlok: '',
                inputPassword: '',
                namaWarga: '',
                blokRumah: ''
            },
            methods: {
                prosesLogin() {
                    const targetBlok = this.inputBlok.toUpperCase().trim();
                    if (!targetBlok || !this.inputPassword) {
                        alert("Harap isi Blok dan Password!");
                        return;
                    }
                    
                    database.ref('warga/' + targetBlok).once('value').then((snapshot) => {
                        const dataWarga = snapshot.val();
                        if (dataWarga && dataWarga.password === this.inputPassword) {
                            this.namaWarga = dataWarga.nama;
                            this.blokRumah = targetBlok;
                            this.isLoggedIn = true;
                        } else {
                            alert("Nomor Blok atau Password Salah / Belum Terdaftar!");
                        }
                    }).catch((error) => {
                        alert("Gagal Terhubung ke Server: " + error.message);
                    });
                },
                logout() {
                    this.isLoggedIn = false;
                    this.inputBlok = '';
                    this.inputPassword = '';
                }
            }
        });
    </script>
</body>
</html>
